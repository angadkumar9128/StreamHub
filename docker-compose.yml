services:
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    command: >
      redpanda start --smp 1 --memory 1G --overprovisioned --node-id 0
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://${KAFKA_EXTERNAL_HOST:-localhost}:19092
      --set redpanda.auto_create_topics_enabled=false
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s
    volumes: ["redpanda_data:/var/lib/redpanda/data"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: streamhub
      POSTGRES_DB: streamhub
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhub -d streamhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["pg_data:/var/lib/postgresql/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9010:9000", "9011:9001"]
    volumes: ["minio_data:/data"]

  api:
    build: ./api
    env_file: .env
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  redpanda_data:
  pg_data:
  minio_data:
